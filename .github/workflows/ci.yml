name: CI

# Pushes to main, and every pull request (once, not again for its branch push).
on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Forked pull requests run with no secrets (the repo has none anyway).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (a tag can be moved; a SHA can't).
# Dependabot keeps the pins current. No dependency cache: nothing a previous run
# wrote can influence this one.

jobs:
  checks:
    name: Types, lint, tests, workflow secrets, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci # .npmrc: no install scripts run
      # Registry signatures and provenance are checked in the `signatures` job below.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:workflows
      - name: Build (placeholder public config; no secrets needed)
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: "true"
      # Serves the build and fails if any page's CSP stops being nonce-strict.
      - run: npm run check:csp

  secrets:
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the latest
          persist-credentials: false
      # Gitleaks (image pinned by digest: v8.30.1) with its default rules and the
      # three hand-checked allowances in .gitleaks.toml. Findings are redacted.
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  signatures:
    name: npm registry signatures and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Current LTS, for the npm it ships: npm 10 (Node 22's) aborts the whole check
      # when a package's attestations arrive as keyless provenance only; npm 11.11+
      # verifies that provenance instead. The app itself is tested on Node 22 above.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci # .npmrc: no install scripts run
      # Names any failing package and npm's reason as an annotation; retries once
      # in a fresh cache. A forged signature can't pass on any attempt.
      - run: npm run check:signatures

  integration:
    name: Full stack (Convex + n8n + Mailpit) smoke test
    runs-on: ubuntu-latest
    needs: [checks, signatures]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Generates throwaway secrets, starts Docker, imports + publishes the n8n
      # workflows, deploys Convex. No Clerk keys: the signed-in app isn't exercised here.
      # The daily reminder workflow is scheduled every minute so the smoke test can
      # watch a real scheduled run (and a failing run reach the error workflow).
      - run: npm run setup
        env:
          LENDLOOP_REMINDER_SCHEDULE: "* * * * *"
      - run: npm run seed
      - run: npm run smoke -- --workflows
      - name: Stack logs
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=200
